name: 🐛 Bug
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What goes wrong?
      description: What did you do, what did you expect, and what happened?
    validations: { required: true }
  - type: input
    id: car
    attributes:
      label: Car model and software version
      placeholder: e.g. Model Y 2025, 2026.32.1
  - type: dropdown
    id: where
    attributes:
      label: Where do you use it?
      options: [Tesla browser, Tesla via YouTube fullscreen, Phone, Computer]
