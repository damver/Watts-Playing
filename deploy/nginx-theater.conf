server {
    listen 80 default_server;
    listen [::]:80 default_server;
    root /var/www/theater;
    index index.html;
    server_name _;

    # logos change rarely; the config should never be cached stale
    location ~* \.(png|jpg|svg|ico)$ { expires 30d; add_header Cache-Control "public"; }
    location = /services.json     { expires -1; add_header Cache-Control "no-store"; }
    location = /index.html        { expires -1; add_header Cache-Control "no-store"; }

    # nieuwsbronnen: dynamisch beheerd via wattsplaying-news.py (CRUD +
    # veilige RSS-proxy met SSRF-check), niet meer via vaste nginx-routes.
    location /api/ {
        proxy_pass http://127.0.0.1:8098/api/;
        proxy_set_header Host $host;
        proxy_read_timeout 20s;
    }

    location / { try_files $uri $uri/ =404; }
}
